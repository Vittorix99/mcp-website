# Illustrative, inactive future workflow. Not tested or a deployment implementation.
# Activation requires a separate owner gate and validation of artifact provenance,
# source commit, IAM bindings, and GitHub environment reviewers.
# Actions: https://github.com/actions/download-artifact
# Google auth: https://github.com/google-github-actions/auth
name: Future production deployment (inactive template)

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Immutable GitHub artifact ID
        required: true
        type: string
      artifact_run_id:
        description: Workflow run ID that produced the artifact
        required: true
        type: string
      artifact_sha256:
        description: Expected SHA-256 digest of release.tar.gz
        required: true
        type: string

permissions: {}

jobs:
  production:
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: 'BLOCKED: future gate required'
        run: |
          echo 'Inactive documentation template: owner gate, provenance, source commit, IAM, and environment reviewers must be validated first.'
          exit 1
      - name: Download immutable release artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
          path: release
      - name: Verify release archive digest
        env:
          EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          printf '%s  %s\n' "$EXPECTED_SHA256" 'release/release.tar.gz' | sha256sum --check --status
      - name: Authenticate to Google Cloud with workload identity federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          project_id: mcp-website-2a1ad
      - name: End without deployment
        run: |
          echo 'Deployment, provenance verification, and rollback are not implemented.'
          exit 1
