name: Core WS1 checks
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ws1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MCP_ENV: test
  GCLOUD_PROJECT: demo-mcp-test
  GOOGLE_CLOUD_PROJECT: demo-mcp-test
  STORAGE_BUCKET: demo-mcp-test.appspot.com
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mcp-backend/functions/requirements-dev.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp-website/package-lock.json
      - name: Native runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libgl1 libglib2.0-0 openjdk-21-jre-headless
      - name: Install locked dependencies
        run: scripts/bootstrap-dev.sh
      - name: Enforce CI identity
        run: .venv/bin/python scripts/ci/assert-safe-environment.py
      - name: Scan repository and PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .venv/bin/python scripts/security/scan_secrets.py --path . --config .secretsignore --quiet
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            .venv/bin/python scripts/security/scan_secrets.py --base "$BASE_SHA" --head "$HEAD_SHA" --config .secretsignore --quiet
          fi
      - name: Validate canonical Firebase configuration
        run: .venv/bin/python scripts/validate-firebase-config.py
      - name: Offline unit suite
        run: scripts/test-unit.sh
      - name: Frontend policy and deterministic build
        working-directory: mcp-website
        run: npm run test:config && npm run lint && npm run build
      - name: Full emulator smoke
        run: scripts/test-emulators.sh
