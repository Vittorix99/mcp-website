name: Release main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [deploy, rollback, verify]
        default: deploy
      rollback_environment:
        type: choice
        options: [staging, production]
        default: staging
      snapshot_run_id:
        description: Trusted main release run containing the rollback snapshot
        type: string
        required: false

permissions:
  contents: read
  actions: read

# Serialize the complete staging/production promotion, including approval.
# Never cancel an in-flight deployment; rollback snapshots survive failed runs.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # The full suite already ran on the pull request. Reuse that result only with proof tied to the same tree
  # (scripts/ci/ci_evidence.py); anything uncertain runs the full suite again.
  evidence:
    if: github.repository == 'Vittorix99/mcp-website' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.evidence.outputs.reuse }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/ci_evidence.py

  verify:
    needs: evidence
    if: needs.evidence.outputs.reuse != 'true'
    uses: ./.github/workflows/pr.yml
    permissions:
      contents: read

  # Single prerequisite of every deployment job: the suite passed now, or passed earlier on the identical tree.
  gate:
    needs: [evidence, verify]
    if: always() && (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && needs.evidence.outputs.reuse == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "CI gate passed (suite reused for the identical tree - ${{ needs.evidence.outputs.reuse }})"

  staging:
    needs: gate
    # `verify` is skipped when the suite is reused, and GitHub skips every job downstream of a skipped job unless
    # the condition says otherwise: require the gate result explicitly instead.
    if: >-
      !cancelled() && needs.gate.result == 'success' && vars.ENABLE_STAGING_DEPLOY == 'true' &&
      (github.event_name == 'push' || inputs.operation == 'deploy')
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      environment: staging
      operation: deploy

  production:
    needs: staging
    if: >-
      !cancelled() && vars.ENABLE_PRODUCTION_DEPLOY == 'true' && needs.staging.result == 'success'
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      environment: production
      operation: deploy

  # Read-only proof of federated cloud access (staging only). Manual, needs no deploy flag,
  # and never snapshots, deploys or changes traffic or data.
  verify-access:
    needs: gate
    if: >-
      !cancelled() && needs.gate.result == 'success' &&
      github.event_name == 'workflow_dispatch' && inputs.operation == 'verify'
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      environment: staging
      operation: verify

  rollback:
    needs: gate
    if: >-
      !cancelled() && needs.gate.result == 'success' &&
      github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback' &&
      ((inputs.rollback_environment == 'staging' && vars.ENABLE_STAGING_DEPLOY == 'true') ||
      (inputs.rollback_environment == 'production' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'))
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      environment: ${{ inputs.rollback_environment }}
      operation: rollback
      snapshot_run_id: ${{ inputs.snapshot_run_id }}
